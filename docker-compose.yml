# Local development services.
#
# Docker is OPTIONAL. If you do not have it, `pnpm db:start` starts an embedded
# PostgreSQL cluster on the same port with the same credentials, so DATABASE_URL
# is identical either way.
#
#   docker compose up -d postgres     # Postgres only — the normal dev setup
#   docker compose up -d              # add Redis for production parity
#
# Redis is deliberately NOT started by default: development mode is designed to
# run without it, and running without it is what keeps that path honest.

services:
  postgres:
    image: postgres:17-alpine
    container_name: bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    ports:
      # 55432 on the host so this never collides with a local Postgres install,
      # and so it matches the embedded-postgres fallback exactly.
      - "55432:5432"
    volumes:
      - bot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bot-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bot-postgres-data:
